{% extends "base.html" %}
{% block title %}StreamWatch – Edit Volunteer {{ volunteer_id }}{% endblock %}
{% block content %}
<p class="muted"><a href="/volunteers/{{ volunteer_id }}">← Back to volunteer</a></p>
<h1>Edit Volunteer</h1>
{% if error %}
<div class="card error">{{ error }}</div>
{% endif %}
<div class="card">
  <form method="post" action="/volunteers/{{ volunteer_id }}/edit">
    <h2>Identity</h2>
    <div class="form-row">
      <label for="first_name">First name</label>
      <input type="text" id="first_name" name="first_name" required value="{{ form.first_name or '' }}">
    </div>
    <div class="form-row">
      <label for="last_name">Last name</label>
      <input type="text" id="last_name" name="last_name" required value="{{ form.last_name or '' }}">
    </div>
    <div class="form-row">
      <label for="perfect_id">Perfect ID</label>
      <input type="text" id="perfect_id" name="perfect_id" value="{{ form.perfect_id or '' }}">
    </div>

    <h2>Contact</h2>
    <div class="form-row">
      <label for="email">Email</label>
      <input type="text" id="email" name="email" value="{{ form.email or '' }}">
    </div>
    <div class="form-row">
      <label for="alt_email">Alt email</label>
      <input type="text" id="alt_email" name="alt_email" value="{{ form.alt_email or '' }}">
    </div>
    <div class="form-row">
      <label for="phone">Phone</label>
      <input type="text" id="phone" name="phone" value="{{ form.phone or '' }}">
    </div>
    <div class="form-row">
      <label for="alt_phone">Alt phone</label>
      <input type="text" id="alt_phone" name="alt_phone" value="{{ form.alt_phone or '' }}">
    </div>
    <div class="form-row">
      <label for="address">Address</label>
      <input type="text" id="address" name="address" value="{{ form.address or '' }}" style="min-width:18rem;">
    </div>
    <div class="form-row">
      <label for="city_id">Municipality</label>
      <select id="city_id" name="city_id">
        <option value="">—</option>
        {% for m in municipalities %}
        <option value="{{ m.municipality_id }}" {% if form.city_id == (m.municipality_id|string) %}selected{% endif %}>{{ m.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-row">
      <label for="state">State</label>
      <input type="text" id="state" name="state" maxlength="2" value="{{ form.state or '' }}" style="width:4rem;">
    </div>
    <div class="form-row">
      <label for="zip_code">ZIP</label>
      <input type="text" id="zip_code" name="zip_code" value="{{ form.zip_code or '' }}">
    </div>

    <h2>Program</h2>
    <div class="form-row">
      <label for="status">Status</label>
      <select id="status" name="status" required>
        {% for s in statuses %}
        <option value="{{ s }}" {% if form.status == s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-row">
      <label><input type="checkbox" name="active_cat" value="1" {% if form.active_cat %}checked{% endif %}> Active CAT</label>
    </div>
    <div class="form-row">
      <label><input type="checkbox" name="active_bat" value="1" {% if form.active_bat %}checked{% endif %}> Active BAT</label>
    </div>
    <div class="form-row">
      <label><input type="checkbox" name="active_bact" value="1" {% if form.active_bact %}checked{% endif %}> Active BACT</label>
    </div>
    <div class="form-row">
      <label><input type="checkbox" name="is_under_17" value="1" {% if form.is_under_17 %}checked{% endif %}> Under 17</label>
    </div>
    <div class="form-row">
      <label for="notes">Notes</label>
      <textarea id="notes" name="notes" maxlength="4000">{{ form.notes or '' }}</textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-primary">Save volunteer</button>
      <a href="/volunteers/{{ volunteer_id }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
