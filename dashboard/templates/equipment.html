{% extends "base.html" %}
{% block title %}StreamWatch – Equipment{% endblock %}
{% block content %}
<h1>Equipment</h1>
<p class="muted">CAT multiparameter meters (TWI inventory).</p>
<div class="card">
  <label for="equipment-search">Search:</label>
  <input type="text" id="equipment-search" placeholder="Equipment code or serial…">
</div>
<div class="card">
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Equipment Code</th><th>Serial Number</th><th>Status</th><th>Last Test Date</th><th></th></tr>
      </thead>
      <tbody id="equipment-tbody"><tr><td colspan="5" class="loading">Loading…</td></tr></tbody>
    </table>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
(function() {
  const tbody = document.getElementById('equipment-tbody');
  const search = document.getElementById('equipment-search');
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function render(items, filter) {
    const q = (filter || '').toLowerCase();
    const list = q ? items.filter(function(e) {
      return (e.equipment_code && e.equipment_code.toLowerCase().includes(q)) ||
        (e.serial_number && String(e.serial_number).toLowerCase().includes(q));
    }) : items;
    tbody.innerHTML = list.length
      ? list.map(function(e) {
          return '<tr><td>' + esc(e.equipment_code) + '</td><td>' + esc(e.serial_number || '—') +
            '</td><td>' + esc(e.status || '—') + '</td><td>' + esc(e.last_test_date || '—') +
            '</td><td><a href="/equipment/' + encodeURIComponent(e.equipment_code) + '">View</a></td></tr>';
        }).join('')
      : '<tr><td colspan="5">No equipment match.</td></tr>';
  }
  search.addEventListener('input', function() { render(window.__equipment || [], search.value); });
  fetch('/api/equipment')
    .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(items) { window.__equipment = items; render(items, search.value); })
    .catch(function() {
      tbody.innerHTML = '<tr><td colspan="5" class="error">We couldn\'t load equipment right now. Please try again in a moment.</td></tr>';
    });
})();
</script>
{% endblock %}
